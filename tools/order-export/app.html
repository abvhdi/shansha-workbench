.record-list{display:grid;max-height:380px;overflow:auto;border-top:1px solid var(--line);border-left:1px solid var(--line)}.record{cursor:pointer;display:grid;grid-template-columns:28px 1fr;gap:11px;width:100%;padding:14px;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--ink);background:#fff;text-align:left}.record:hover{background:var(--soft)}.record.selected{color:#fff;background:var(--brown)}.record .check{display:grid;place-items:center;width:22px;height:22px;border:1px solid #aaa;color:transparent}.record.selected .check{border-color:#fff;color:var(--brown);background:#fff}.record b,.record small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.record b{margin-bottom:4px;font-size:13px}.record small{color:var(--muted);font-size:11px}.record.selected small{color:rgba(255,255,255,.66)}.empty{padding:32px;color:var(--muted);text-align:center}
.template-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.button{cursor:pointer;display:inline-flex;min-height:43px;align-items:center;justify-content:center;padding:0 17px;border-radius:0;font-size:12px;font-weight:700;text-decoration:none}.button:disabled{cursor:not-allowed;opacity:.4}.button.primary{min-width:150px;border:1px solid var(--brown);color:#fff;background:var(--brown)}.button.primary:hover:not(:disabled){background:#211813}.button.secondary{border:1px solid var(--ink);color:var(--ink);background:#fff}.button.ghost{border:1px solid var(--line);color:var(--ink);background:var(--soft)}.muted{color:var(--muted);font-size:12px}.fields-box{margin-top:20px;padding-top:17px;border-top:1px solid var(--line)}.fields-box summary{cursor:pointer;font-size:12px;font-weight:700}.field-tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.field-tags button{cursor:pointer;padding:6px 9px;border:1px solid var(--line);border-radius:0;color:var(--ink);background:#fff;font-size:11px}
